[project]
name = "tracewatch"
version = "0.1.0"
description = "Flight recorder for a launched process: Tracee (kernel) + mitmproxy (HTTP), reconstructed post facto"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ebpf", "tracee", "mitmproxy", "observability", "process-tracing", "security", "reports"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
dependencies = ["mitmproxy>=12.3"]

[project.urls]
Homepage = "https://andrewbrooks.github.io/tracewatch/"
Source = "https://github.com/andrewbrooks/tracewatch"
Documentation = "https://github.com/andrewbrooks/tracewatch/tree/main/docs"

[project.scripts]
tracewatch = "tracewatch.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=8",
    "ruff>=0.6",
    "websockets>=17.4",
]

[tool.uv]
# mitmproxy 12.3.1 caps tornado below the release that fixes three CVEs. tracewatch only uses mitmdump (tornado serves
# mitmweb's UI), so the override is a belt-and-braces measure for the lockfile; revisit when mitmproxy lifts its cap.
override-dependencies = ["tornado>=6.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracewatch"]

[tool.ruff]
line-length = 120
extend-exclude = ["spikes"]  # frozen Phase 0 evidence, not maintained code

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/tracewatch/findings.py" = ["E501", "UP031"]  # prose-heavy rule texts
"src/tracewatch/report_md.py" = ["E501"]  # table-building expressions
"src/tracewatch/report_html.py" = ["E501"]  # the HTML template
"src/tracewatch/diff_html.py" = ["E501"]  # the HTML template
"src/tracewatch/findings_catalog.py" = ["E501"]  # prose entries
"tests/test_model.py" = ["E501"]  # dense fixture literals
"tests/test_findings_rules.py" = ["E501"]  # command-line fixtures
"tools/*.py" = ["E501"]  # page templates and prose
"tests/test_redact.py" = ["E501"]  # secret-shaped fixtures
"tests/browser/*.py" = ["E501", "UP031"]  # long JS snippets and payload literals

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]  # integration scripts (tty_test.py, ...) are run by hand, not collected
