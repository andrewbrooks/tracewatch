  evasion: 'Evasion', privilege: 'Privilege', integrity: 'Recording', reliability: 'Reliability',

const STORY_SKIP = new Set(['recording-integrity', 'secrets-redacted', 'nonzero-exit', 'inline-code', 'killed-by-signal', 'detached-process']);

  const steps = [];
